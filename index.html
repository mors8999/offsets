<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>offsets</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #121212;
    color: white;
    font-family: Arial, sans-serif;
}

button {
    background: #2d6cdf;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 5px;
    cursor: pointer;
    margin-bottom: 10px;
}

button:hover {
    background: #1f4fb8;
}

pre {
    background: #1e1e1e;
    padding: 15px;
    border-radius: 5px;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>

<body>

<button onclick="copyText()">Copy</button>

<pre id="text">Loading...</pre>

<script>
let content = "";

async function load() {
    try {
        const res = await fetch("https://offsets.imtheo.lol/Offsets.hpp");

        if (!res.ok) throw new Error("HTTP " + res.status);

        content = await res.text();

        document.getElementById("text").textContent = content;

    } catch (e) {
        document.getElementById("text").textContent =
            "Failed to load text:\n\n" + e;
    }
}

function copyText() {
    navigator.clipboard.writeText(content || "");
}

load();
</script>

</body>
</html>
