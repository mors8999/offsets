<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>offsets</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d1117;
    color:#e6edf3;
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.title{
    font-size:42px;
    font-weight:700;
    margin-bottom:20px;
    color:#58a6ff;
}

.card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:18px;
    padding:25px;
    box-shadow:0 0 30px rgba(0,0,0,.35);
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:15px;
}

.label{
    font-size:18px;
    font-weight:600;
}

button{
    background:#238636;
    border:none;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:.2s;
}

button:hover{
    background:#2ea043;
    transform:translateY(-1px);
}

#content{
    background:#0d1117;
    border:1px solid #30363d;
    border-radius:12px;
    padding:20px;

    white-space:pre-wrap;
    word-wrap:break-word;

    font-size:15px;
    line-height:1.7;

    overflow-x:auto;
    max-height:none;
}

.footer{
    margin-top:20px;
    color:#7d8590;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

    <h1 class="title">offsets</h1>

    <div class="card">

        <div class="topbar">
            <div class="label">Modified Text Output</div>

            <button onclick="copyText()">
                Copy
            </button>
        </div>

        <div id="content">
Loading...
        </div>

        <div class="footer">
            Auto rendered from JavaScript
        </div>

    </div>

</div>

<script>

const rawText = `PASTE YOUR FULL TEXT HERE`;

function modifyText(text){

    return text
        .replace(/hello/gi, "hi")
        .replace(/test/gi, "modified")
        .toUpperCase();

}

const finalText = modifyText(rawText);

document.getElementById("content").textContent = finalText;

function copyText(){

    navigator.clipboard.writeText(finalText);

    const btn = document.querySelector("button");

    btn.innerText = "Copied!";

    setTimeout(() => {
        btn.innerText = "Copy";
    }, 1500);
}

</script>

</body>
</html>
