name: Update Offsets (Cleaned)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download file
        run: curl -L "https://offsets.imtheo.lol/Offsets.hpp" -o offsets_raw.txt

      - name: Clean file
        run: |
          cat offsets_raw.txt \
          | grep -v "Dumped By" \
          | grep -v "imtheo.lol" \
          | grep -v "RbxDumperV2" \
          | grep -v "Join the discord" \
          | grep -v "discord.gg" \
          > offsets.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add offsets.txt
          git commit -m "update cleaned offsets" || exit 0
          git push
