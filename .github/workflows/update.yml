name: Update Offsets (Cleaned)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download offsets
        run: curl -L "https://offsets.imtheo.lol/Offsets.hpp" -o offsets_raw.txt

      - name: Clean header block
        run: |
          awk '
          BEGIN { skip=0 }

          # start of big header block
          /\* =+/ { skip=1; next }

          # end of header block (final */ line)
          skip==1 && /\*\// { skip=0; next }

          # skip everything inside header
          skip==1 { next }

          # output everything else
          { print }
          ' offsets_raw.txt > offsets.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add offsets.txt
          git commit -m "update cleaned offsets" || exit 0
          git push
